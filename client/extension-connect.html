<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect Extension | SocialFeed Hub</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: #111522;
      color: #f8fafc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at top, #252047 0, #111522 60%);
    }

    .card {
      width: min(100%, 460px);
      padding: 32px;
      border: 1px solid rgba(148, 163, 184, .28);
      border-radius: 24px;
      background: rgba(25, 30, 46, .92);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .35);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .brand img {
      width: 42px;
      height: 42px;
      border-radius: 12px;
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
    }

    p {
      color: #aeb9d0;
      line-height: 1.55;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      color: #cbd5e1;
      font-size: .84rem;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #3a4358;
      border-radius: 10px;
      background: #171d2b;
      color: #f8fafc;
      font: inherit;
    }

    input:focus {
      outline: 2px solid #fb3b68;
      outline-offset: 2px;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 13px 16px;
      border: 0;
      border-radius: 10px;
      background: linear-gradient(135deg, #fb3b68, #a43be4);
      color: white;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: .65;
      cursor: wait;
    }

    .status {
      margin: 0 0 4px;
      padding: 12px 14px;
      border-radius: 10px;
      background: rgba(59, 130, 246, .1);
      color: #bfdbfe;
    }

    .error {
      color: #fda4af;
    }

    .success {
      color: #86efac;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="brand"><img src="/favicon.svg" alt="">
      <div>
        <h1>Connect SocialFeed</h1>
        <p style="margin:2px 0 0">Browser extension pairing</p>
      </div>
    </div>
    <p id="status" class="status">Checking your SocialFeed session…</p>
    <form id="login-form" hidden>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button type="submit" id="login-submit">Sign in and continue</button>
    </form>
    <section id="connect-panel" hidden>
      <p>You are signed in. Approve this browser extension to save scanned bookmarks to your private library.</p>
      <button type="button" id="connect-button">Connect extension</button>
    </section>
    <p id="error" class="error" hidden></p>
  </main>
  <script type="module" src="/src/extension-connect.js"></script>
</body>

</html>
